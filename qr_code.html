<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习打卡二维码</title>
<style>
  :root{--primary:#1677FF;--bg:#F5F7FA;--card:#FFF;--text:#1A1A1A;--sub:#666;--muted:#999;--border:#E8E8E8;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.06)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--card);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--shadow);text-align:center;max-width:420px;width:100%}
  .icon{font-size:48px;margin-bottom:16px}
  h1{font-size:20px;font-weight:700;margin-bottom:8px}
  .subtitle{font-size:14px;color:var(--sub);margin-bottom:24px;line-height:1.6}
  .qr-wrap{background:#FFF;border:2px solid var(--border);border-radius:16px;padding:20px;display:inline-block;margin-bottom:20px}
  .qr-wrap img{border-radius:8px;max-width:100%;height:auto;display:block}
  .tips{background:var(--bg);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--sub);line-height:1.7;text-align:left}
  .tips strong{color:var(--text);display:block;margin-bottom:4px}
  .url{font-size:12px;color:var(--muted);margin-top:16px;word-break:break-all;font-family:monospace}
  @media(max-width:480px){.card{padding:24px 18px}.qr-wrap{padding:14px}}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128218;</div>
    <h1>学习打卡手机填报</h1>
    <div class="subtitle">扫描二维码，在手机上直接打开填报页面</div>
    <div class="qr-wrap" id="qrContainer">
      <img id="qrImg" alt="二维码加载中" style="display:none;">
      <div id="qrFallback" style="color:#999;font-size:13px;">二维码加载中...</div>
    </div>
    <div class="tips">
      <strong>使用说明</strong>
      1. 用钉钉/微信/浏览器扫描上方二维码<br>
      2. 在手机浏览器中打开填报页面<br>
      3. 填写学习进度后提交打卡<br>
      4. 组长可在「组长汇总」中一键汇总
    </div>
    <div class="url" id="urlDisplay"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    (function(){
      var url = 'https://yuan8-cell.github.io/study-checkin/daily_checkin.html';
      document.getElementById('urlDisplay').textContent = url;
      var container = document.getElementById('qrContainer');
      var fallback = document.getElementById('qrFallback');
      var qrImg = document.getElementById('qrImg');

      if(typeof QRCode !== 'undefined'){
        QRCode.toCanvas(document.createElement('canvas'), url, {
          width: 260, margin: 1, color: { dark: '#1677FF', light: '#FFFFFF' }
        }, function(error, canvas){
          if(error){
            fallback.innerHTML = '<div style="color:#999;font-size:13px;">二维码生成失败，请刷新重试</div>';
            return;
          }
          canvas.style.maxWidth = '100%';
          canvas.style.height = 'auto';
          fallback.style.display = 'none';
          container.insertBefore(canvas, container.firstChild);
        });
      } else {
        fallback.innerHTML = '<div style="color:#999;font-size:13px;">二维码库加载失败，请检查网络后刷新</div>';
      }
    })();
  </script>
</body>
</html>
